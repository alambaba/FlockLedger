name: Build FlockLedger APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build FlockLedger APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Firebase configuration
        run: |
          test -f app/google-services.json || {
            echo "ERROR: Missing app/google-services.json"
            exit 1
          }

          grep -q '"project_id": "flockledger-49fa7"' app/google-services.json

          grep -q '"package_name": "com.aistudio.flockledger.krmzpq"' app/google-services.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restore existing signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ERROR: Original signing key is missing."
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > debug.keystore

          test -s debug.keystore

          keytool -list \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey

      - name: Verify application ID
        run: |
          grep -q 'applicationId = "com.aistudio.flockledger.krmzpq"' app/build.gradle.kts

          grep -nE 'applicationId|versionCode|versionName' app/build.gradle.kts

      - name: Build APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          SDK_BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)

          "$SDK_BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"

          mkdir -p release-output

          cp "$APK" release-output/FlockLedger-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FlockLedger-APK
          path: release-output/FlockLedger-debug.apk
          if-no-files-found: error
          retention-days: 30
