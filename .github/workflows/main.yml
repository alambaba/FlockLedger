name: Build FlockLedger APK

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/main.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release FlockLedger APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Check Firebase Configuration
        run: |
          test -f app/google-services.json || {
            echo "ERROR: Missing app/google-services.json"
            exit 1
          }

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restore Consistent Signing Key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          elif [ -f debug.keystore.base64 ]; then
            base64 --decode debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -s debug.keystore

      - name: Compute Versioned APK Name
        id: version
        run: |
          BASE_CODE=$(grep -E '^\s*versionCode\s*=' app/build.gradle.kts | sed -E 's/[^0-9]//g' | head -n1)
          BASE_NAME=$(grep -E '^\s*versionName\s*=' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/' | head -n1)
          BASE_CODE=${BASE_CODE:-2}
          BASE_NAME=${BASE_NAME:-1.1}
          NEW_CODE=$((BASE_CODE + GITHUB_RUN_NUMBER))
          NEW_NAME="${BASE_NAME}.${GITHUB_RUN_NUMBER}"
          sed -i -E "s/^([[:space:]]*versionCode[[:space:]]*=).*/\1 ${NEW_CODE}/" app/build.gradle.kts
          sed -i -E "s/^([[:space:]]*versionName[[:space:]]*=).*/\1 \"${NEW_NAME}\"/" app/build.gradle.kts
          echo "version_code=${NEW_CODE}" >> "$GITHUB_OUTPUT"
          echo "version_name=${NEW_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag_name=v${NEW_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Package & Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          SDK_BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p release-output
          cp "$APK" "release-output/FlockLedger-v${{ steps.version.outputs.version_name }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlockLedger-APK
          path: release-output/FlockLedger-v${{ steps.version.outputs.version_name }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Direct Download APK Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag_name }}"
          APK_FILE="release-output/FlockLedger-v${{ steps.version.outputs.version_name }}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_FILE" --clobber
          else
            gh release create "$TAG" "$APK_FILE" \
              --title "FlockLedger $TAG" \
              --notes "Download FlockLedger-v${{ steps.version.outputs.version_name }}.apk directly on your Android phone to install or update safely without losing data."
          fi
