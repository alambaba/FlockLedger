name: Build & Release FlockLedger APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

      - name: Accept Android SDK Licenses & Install SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Bump Release Version
        id: version
        run: |
          BASE_CODE=$(grep -E '^\s*versionCode\s*=' app/build.gradle.kts | sed -E 's/[^0-9]//g' | head -n1)
          BASE_NAME=$(grep -E '^\s*versionName\s*=' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/' | head -n1)
          BASE_CODE=${BASE_CODE:-2}
          BASE_NAME=${BASE_NAME:-1.1}
          NEW_CODE=$((BASE_CODE + GITHUB_RUN_NUMBER))
          if [[ "${GITHUB_REF_TYPE:-branch}" == "tag" ]]; then
            NEW_NAME="${GITHUB_REF_NAME#v}"
          else
            NEW_NAME="${BASE_NAME}.${GITHUB_RUN_NUMBER}"
          fi
          sed -i -E "s/^([[:space:]]*versionCode[[:space:]]*=).*/\1 ${NEW_CODE}/" app/build.gradle.kts
          sed -i -E "s/^([[:space:]]*versionName[[:space:]]*=).*/\1 \"${NEW_NAME}\"/" app/build.gradle.kts
          echo "version_code=${NEW_CODE}" >> "$GITHUB_OUTPUT"
          echo "version_name=${NEW_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag_name=v${NEW_NAME}" >> "$GITHUB_OUTPUT"

      - name: Prepare Signing Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build FlockLedger APK
        run: gradle assembleDebug --stacktrace

      - name: Package Versioned APK
        run: |
          APK_SRC=$(ls app/build/outputs/apk/debug/*.apk | head -n1)
          cp "$APK_SRC" "FlockLedger-v${{ steps.version.outputs.version_name }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlockLedger-Android-APK
          path: FlockLedger-v${{ steps.version.outputs.version_name }}.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release with APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag_name }}"
          APK_FILE="FlockLedger-v${{ steps.version.outputs.version_name }}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_FILE" --clobber
          else
            gh release create "$TAG" "$APK_FILE" \
              --title "FlockLedger $TAG" \
              --notes "Automatic release $TAG (versionCode ${{ steps.version.outputs.version_code }}). Always keep a safety backup in Downloads/FlockLedger before updating."
          fi
